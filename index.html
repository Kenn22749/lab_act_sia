<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nissan GTR Generations</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

/* Animated gradient background */

body{
background: linear-gradient(-45deg,#89f7fe,#66a6ff,#fbc2eb,#a6c1ee);
background-size:400% 400%;
animation:gradientMove 10s ease infinite;
min-height:100vh;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* Header */

header{
text-align:center;
padding:50px 20px;
color:white;
}

header h1{
font-size:48px;
letter-spacing:2px;
text-shadow:0 5px 15px rgba(0,0,0,0.3);
}

header p{
margin-top:10px;
}

/* Grid */

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
padding:40px;
max-width:1200px;
margin:auto;
}

/* Cards */

.card{
background:rgba(255,255,255,0.3);
backdrop-filter:blur(10px);
border-radius:15px;
overflow:hidden;
cursor:pointer;
transition:0.3s;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card:hover{
transform:translateY(-10px) scale(1.03);
}

/* Video */

.card video{
width:100%;
height:200px;
object-fit:cover;
}

/* Content */

.card-content{
padding:20px;
color:#222;
}

.card-content h2{
margin-bottom:10px;
}

.card-content p{
font-size:14px;
}

/* Popup */

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:none;
align-items:center;
justify-content:center;
}

.popup-content{
background:white;
padding:30px;
border-radius:12px;
max-width:400px;
text-align:center;
}

.popup-content button{
margin-top:15px;
padding:10px 18px;
border:none;
background:#66a6ff;
color:white;
border-radius:6px;
cursor:pointer;
}

</style>
</head>

<body>

<header>
<h1>Nissan GTR Generations</h1>
<p>The Evolution of Godzilla</p>
</header>

<div class="container">

<!-- R32 -->

<div class="card" onclick="showInfo('R32 GT-R','1989–1994. The R32 dominated racing and earned the nickname Godzilla.')">

<video autoplay muted loop>
<source src="videos/r32.mp4" type="video/mp4">
</video>

<div class="card-content">
<h2>R32 GT-R</h2>
<p>The rebirth of the Skyline legend.</p>
</div>

</div>

<!-- R33 -->

<div class="card" onclick="showInfo('R33 GT-R','1995–1998. Improved aerodynamics and Nürburgring performance.')">

<video autoplay muted loop>
<source src="videos/r33.mp4" type="video/mp4">
</video>

<div class="card-content">
<h2>R33 GT-R</h2>
<p>A more refined racing machine.</p>
</div>

</div>

<!-- R34 -->

<div class="card" onclick="showInfo('R34 GT-R','1999–2002. One of the most iconic JDM cars in the world.')">

<video autoplay muted loop>
<source src="videos/r34.mp4" type="video/mp4">
</video>

<div class="card-content">
<h2>R34 GT-R</h2>
<p>The fan-favorite legend.</p>
</div>

</div>

<!-- R35 -->

<div class="card" onclick="showInfo('R35 GT-R','2007–Present. A modern supercar killer with advanced AWD.')">

<video autoplay muted loop>
<source src="videos/r35.mp4" type="video/mp4">
</video>

<div class="card-content">
<h2>R35 GT-R</h2>
<p>The modern Godzilla.</p>
</div>

</div>

</div>

<!-- Popup -->

<div class="popup" id="popup">

<div class="popup-content">
<h2 id="title"></h2>
<p id="text"></p>
<button onclick="closePopup()">Close</button>
</div>

</div>

<script>

function showInfo(title,text){
document.getElementById("popup").style.display="flex";
document.getElementById("title").innerText=title;
document.getElementById("text").innerText=text;
}

function closePopup(){
document.getElementById("popup").style.display="none";
}

</script>

</body>
</html>
