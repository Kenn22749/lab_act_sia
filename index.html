<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTR Generations</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

/* Animated background */

body{
background: linear-gradient(-45deg,#89f7fe,#66a6ff,#fbc2eb,#a6c1ee);
background-size:400% 400%;
animation:gradientMove 12s ease infinite;
min-height:100vh;
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* Header */

header{
text-align:center;
padding:50px 20px;
color:white;
}

header h1{
font-size:48px;
letter-spacing:2px;
text-shadow:0 5px 15px rgba(0,0,0,0.3);
}

header p{
margin-top:10px;
opacity:0.9;
}

/* Grid */

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
padding:40px;
max-width:1200px;
margin:auto;
}

/* Cards */

.card{
background:rgba(255,255,255,0.25);
backdrop-filter:blur(10px);
border-radius:18px;
overflow:hidden;
cursor:pointer;
transition:0.4s;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card:hover{
transform:translateY(-10px) scale(1.03);
box-shadow:0 20px 40px rgba(0,0,0,0.3);
}

/* Video */

.card video{
width:100%;
height:200px;
object-fit:cover;
}

/* Content */

.card-content{
padding:20px;
color:#222;
}

.card-content h2{
margin-bottom:10px;
}

.card-content p{
font-size:14px;
}

/* Popup */

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
display:none;
align-items:center;
justify-content:center;
}

.popup-content{
background:white;
padding:30px;
border-radius:12px;
max-width:400px;
text-align:center;
}

.popup-content button{
margin-top:15px;
padding:10px 18px;
border:none;
background:#66a6ff;
color:white;
border-radius:6px;
cursor:pointer;
}

</style>
</head>

<body>

<header>
<h1>Nissan GTR Generations</h1>
<p>The Evolution of Godzilla</p>
</header>

<div class="container">

<!-- R32 -->

<div class="card" onclick="showInfo('R32 GT-R','Produced from 1989 to 1994, the R32 dominated motorsports and earned the nickname Godzilla.')">

<video autoplay muted loop>
<source src="videos/r32.mp4" type="video/mp4">
</video>

<div class="card-content">
<h2>R32 GT-R</h2>
<p>The rebirth of the legendary Skyline.</p>
</div>

</div>

<!-- R33 -->

<div class="card" onclick="showInfo('R33 GT-R','Produced from 1995 to 1998. Known for its Nürburgring performance and improved stability.')">

<video autoplay muted loop>
<source src="videos/r33.mp4" type="video/mp4">
</video>

<div class="card-content">
<h2>R33 GT-R</h2>
<p>A more refined racing machine.</p>
</div>

</div>

<!-- R34 -->

<div class="card" onclick="showInfo('R34 GT-R','Produced from 1999 to 2002. One of the most iconic JDM cars ever created.')">

<video autoplay muted loop>
<source src="videos/r34.mp4" type="video/mp4">
</video>

<div class="card-content">
<h2>R34 GT-R</h2>
<p>The fan favorite legend.</p>
</div>

</div>

<!-- R35 -->

<div class="card" onclick="showInfo('R35 GT-R','Released in 2007 and still in production. A modern supercar killer.')">

<video autoplay muted loop>
<source src="videos/r35.mp4" type="video/mp4">
</video>

<div class="card-content">
<h2>R35 GT-R</h2>
<p>The modern Godzilla.</p>
</div>

</div>

</div>

<!-- Popup -->

<div class="popup" id="popup">

<div class="popup-content">

<h2 id="title"></h2>
<p id="text"></p>

<button onclick="closePopup()">Close</button>

</div>

</div>

<script>

function showInfo(title,text){

document.getElementById("popup").style.display="flex"
document.getElementById("title").innerText=title
document.getElementById("text").innerText=text

}

function closePopup(){

document.getElementById("popup").style.display="none"

}

</script>

</body>
</html>
