<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTR Generations</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

body{
height:100vh;
overflow-x:hidden;
background: linear-gradient(-45deg,#89f7fe,#66a6ff,#fbc2eb,#a6c1ee);
background-size:400% 400%;
animation:bgMove 12s infinite alternate;
}

/* animated background */
@keyframes bgMove{
0%{background-position:0% 50%;}
100%{background-position:100% 50%;}
}

header{
text-align:center;
padding:50px 20px;
color:white;
}

header h1{
font-size:48px;
letter-spacing:2px;
text-shadow:0 5px 10px rgba(0,0,0,0.2);
}

header p{
opacity:0.9;
margin-top:10px;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:30px;
padding:40px;
max-width:1200px;
margin:auto;
}

/* card design */

.card{
background:rgba(255,255,255,0.25);
backdrop-filter:blur(10px);
border-radius:18px;
overflow:hidden;
transition:0.4s;
cursor:pointer;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.card:hover{
transform:translateY(-10px) scale(1.03);
box-shadow:0 20px 40px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card-content{
padding:20px;
color:#222;
}

.card h2{
margin-bottom:8px;
}

.card p{
font-size:14px;
}

/* popup */

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
display:none;
align-items:center;
justify-content:center;
}

.popup-content{
background:white;
padding:30px;
border-radius:12px;
max-width:400px;
text-align:center;
}

.close{
margin-top:15px;
padding:8px 16px;
border:none;
background:#66a6ff;
color:white;
border-radius:6px;
cursor:pointer;
}

</style>
</head>

<body>

<header>
<h1>Nissan GTR Generations</h1>
<p>The Evolution of Godzilla</p>
</header>

<div class="container">

<div class="card" onclick="showInfo('R32 GT-R','1989–1994. The legendary Godzilla that dominated motorsports with the RB26 twin-turbo engine.')">
<img src="images/r32.jpg">
<div class="card-content">
<h2>R32 GT-R</h2>
<p>The rebirth of the GT-R legend.</p>
</div>
</div>

<div class="card" onclick="showInfo('R33 GT-R','1995–1998. Improved aerodynamics and stability. Famous for its Nürburgring performance.')">
<img src="images/r33.jpg">
<div class="card-content">
<h2>R33 GT-R</h2>
<p>The refined racing machine.</p>
</div>
</div>

<div class="card" onclick="showInfo('R34 GT-R','1999–2002. One of the most iconic JDM cars, known from games and movies.')">
<img src="images/r34.jpg">
<div class="card-content">
<h2>R34 GT-R</h2>
<p>The fan-favorite legend.</p>
</div>
</div>

<div class="card" onclick="showInfo('R35 GT-R','2007–Present. Modern supercar killer with advanced AWD and twin-turbo V6.')">
<img src="images/r35.jpg">
<div class="card-content">
<h2>R35 GT-R</h2>
<p>The modern Godzilla.</p>
</div>
</div>

</div>

<div class="popup" id="popup">
<div class="popup-content">
<h2 id="title"></h2>
<p id="text"></p>
<button class="close" onclick="closePopup()">Close</button>
</div>
</div>

<script>

function showInfo(title,text){
document.getElementById("popup").style.display="flex";
document.getElementById("title").innerText=title;
document.getElementById("text").innerText=text;
}

function closePopup(){
document.getElementById("popup").style.display="none";
}

</script>

</body>
</html>
